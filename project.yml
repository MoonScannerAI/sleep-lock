name: SleepLock
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    BUNDLE_PREFIX: com.andyli
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SleepLock:
    type: application
    platform: iOS
    sources:
      - SleepLock
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sleeplock
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: SleepLock/SleepLock.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).sleeplock
    info:
      path: SleepLock/Info.plist
      properties:
        CFBundleDisplayName: Sleep Lock
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: group.$(BUNDLE_PREFIX).sleeplock
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - target: ActivityMonitor
      - target: ShieldConfig
      - target: ShieldAction

  ActivityMonitor:
    type: app-extension
    platform: iOS
    sources:
      - ActivityMonitor
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sleeplock.ActivityMonitor
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ActivityMonitor/ActivityMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).sleeplock
    info:
      path: ActivityMonitor/Info.plist
      properties:
        CFBundleDisplayName: Sleep Lock Monitor
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: group.$(BUNDLE_PREFIX).sleeplock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension

  ShieldConfig:
    type: app-extension
    platform: iOS
    sources:
      - ShieldConfig
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sleeplock.ShieldConfig
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: ShieldConfig/ShieldConfig.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).sleeplock
    info:
      path: ShieldConfig/Info.plist
      properties:
        CFBundleDisplayName: Sleep Lock Shield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: group.$(BUNDLE_PREFIX).sleeplock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension

  ShieldAction:
    type: app-extension
    platform: iOS
    sources:
      - ShieldAction
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).sleeplock.ShieldAction
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        # Avoid a Swift module named "ShieldAction" shadowing ManagedSettings.ShieldAction.
        PRODUCT_MODULE_NAME: SleepLockShieldAction
    entitlements:
      path: ShieldAction/ShieldAction.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups:
          - group.$(BUNDLE_PREFIX).sleeplock
    info:
      path: ShieldAction/Info.plist
      properties:
        CFBundleDisplayName: Sleep Lock Action
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: group.$(BUNDLE_PREFIX).sleeplock
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension

schemes:
  SleepLock:
    build:
      targets:
        SleepLock: all
    run:
      config: Debug
    archive:
      config: Release
